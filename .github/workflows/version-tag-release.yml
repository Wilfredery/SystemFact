name: version-tag-release

# Dev-phase versioning policy: milestones are cut as git tags (v*).
# This workflow gates the tag on the full test suite and publishes a
# GitHub Release with auto-generated notes from conventional commits.
# When the project reaches production this is replaced by release-please.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: "app/package.json"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Test suite (tag gate)
        working-directory: app
        run: pnpm test

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
