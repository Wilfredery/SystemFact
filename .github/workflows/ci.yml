# ============================================================
# CI — SystemFact
#
# Corre en cada PR que apunta a `master` y otra vez sobre `master` después
# del merge (verificación post-merge + insumo para release-please).
#
# Capas (AGENTS.md § Testing):
#   1. quality     → ESLint, TypeScript estricto (noEmit) y `prisma validate`
#   2. unit        → Jest (dominio fiscal, aplicación, UI jsdom) sin base de datos
#   3. integration → Jest contra Postgres 17.6 REAL con RLS forzado (rol
#                    systemfact_app NOBYPASSRLS), igual que el entorno local
#   4. build       → `next build` de producción (detecta errores de build-time)
#   5. commits     → guardián de Conventional Commits (insumo de release-please)
#   6. e2e         → smoke Playwright sobre un stack Supabase LOCAL y efímero
#                    (`supabase start`); no necesita ningún secret real
#                    (issue #138, opción C)
#
# El job agregado "CI gate" es el único check requerido por la protección de
# rama: si un job obligatorio falla, el gate falla.
# ============================================================
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela los jobs todavía en vuelo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# El código Next.js vive en app/ (el root del repo no es un paquete Node).
defaults:
  run:
    working-directory: app

jobs:
  # ----------------------------------------------------------
  # 1. Estilo, tipos y schema
  # ----------------------------------------------------------
  quality:
    name: Lint / types / schema
    runs-on: ubuntu-latest
    env:
      # Valores dummy: ningún chequeo de este job toca una base de datos, pero
      # `src/lib/env.ts` (y `prisma validate`) esperan que las variables existan.
      DATABASE_URL: postgresql://systemfact_app:ci@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: ESLint (incluye la regla systemfact/server-action-must-wrap-tenant)
        run: pnpm lint

      # `LayoutProps`/`PageProps` son tipos globales generados por el typegen
      # de Next 16 (next-env.d.ts + .next/types). Este job no corre build/dev,
      # así que el typegen debe ejecutarse explícitamente antes del tsc.
      - name: Generate Next route types (next typegen)
        run: pnpm exec next typegen

      - name: TypeScript estricto (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Prisma schema validation
        run: pnpm exec prisma validate

  # ----------------------------------------------------------
  # 2. Tests unitarios (sin base de datos: el dominio es puro)
  # ----------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Jest (dominio + aplicación + UI)
        run: pnpm test

  # ----------------------------------------------------------
  # 3. Integración contra Postgres real con RLS
  # ----------------------------------------------------------
  # Reproduce el entorno de SETUP-LOCAL.md dentro del runner:
  #   - Postgres 17.6 (misma major que el proyecto Supabase),
  #   - migraciones aplicadas como superuser (DIRECT_URL),
  #   - rol de aplicación `systemfact_app` NOBYPASSRLS con password efímero
  #     (la migración create_app_role lo crea SIN password, out-of-band por
  #     diseño; acá lo seteamos solo para esta base descartable).
  integration:
    name: Integration tests (Postgres + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Credenciales efímeras y SOLO para este contenedor descartable.
      PGSUPERPASSWORD: postgres
      APP_PASSWORD: ci-app-password
      TEST_DB: systemfact_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Ensure psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Provision test database, migrations and app role
        run: |
          set -euo pipefail
          export PGPASSWORD="${PGSUPERPASSWORD}"
          SUPER_URL="postgresql://postgres:${PGSUPERPASSWORD}@localhost:5432/${TEST_DB}"

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE ${TEST_DB}"

          # El harness de integración lee app/.env.integration en el globalSetup
          # de Jest; se escribe antes de migrar para que todo el job use las
          # mismas credenciales.
          cat > .env.integration <<EOF
          DATABASE_URL="postgresql://systemfact_app:${APP_PASSWORD}@localhost:5432/${TEST_DB}"
          DIRECT_URL="${SUPER_URL}"
          NEXT_PUBLIC_SUPABASE_URL="http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY="integration-test-key"
          EOF

          # DDL como superuser. DATABASE_URL se fuerza al mismo rol para que el
          # deploy funcione aunque el config de Prisma no sea autodetectado.
          DATABASE_URL="${SUPER_URL}" DIRECT_URL="${SUPER_URL}" pnpm exec prisma migrate deploy

          # create_app_role crea el rol sin password y otorga CONNECT solo sobre
          # la base `postgres`; acá se completa para esta base de test.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE systemfact_app WITH PASSWORD '${APP_PASSWORD}'" \
            -c "GRANT CONNECT ON DATABASE ${TEST_DB} TO systemfact_app"

      # El verificador de prerrequisitos RLS nunca corría automáticamente en CI:
      # sólo a mano. Rechaza un DATABASE_URL que conecte como `postgres`,
      # `supabase_admin`, un rol con BYPASSRLS o dueño de las tablas — o sea,
      # exactamente la configuración que desactivaría las policies que el job
      # de integración cree estar probando. Las cuatro variables se pasan
      # explícitas (mismos valores que .env.integration, que `dotenv/config` NO
      # lee porque solo carga .env) porque `verify-rls.ts` importa
      # `@/lib/prisma` -> `@/lib/env`, que valida las cuatro al evaluarse.
      - name: RLS prerequisites (pnpm rls:verify)
        run: |
          DATABASE_URL="postgresql://systemfact_app:${APP_PASSWORD}@localhost:5432/${TEST_DB}" \
          DIRECT_URL="postgresql://postgres:${PGSUPERPASSWORD}@localhost:5432/${TEST_DB}" \
          NEXT_PUBLIC_SUPABASE_URL="http://localhost:54321" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="integration-test-key" \
          pnpm rls:verify

      - name: Jest integration suite (RLS enforced)
        run: pnpm test:integration

  # ----------------------------------------------------------
  # 4. Build de producción
  # ----------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # `next build` no necesita base de datos; sí necesita que las variables
      # validadas por `src/lib/env.ts` existan durante la recolección de páginas.
      DATABASE_URL: postgresql://systemfact_app:ci@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: next build
        run: pnpm build

  # ----------------------------------------------------------
  # 5. Guardián de Conventional Commits (solo PRs)
  # ----------------------------------------------------------
  # release-please deriva la próxima versión y el CHANGELOG de los commits que
  # entran a master: un asunto no convencional desaparece del changelog.
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hace falta la historia completa para diffear contra la base

      - uses: ./.github/actions/setup-project

      - name: Validate commit messages
        run: |
          pnpm exec tsx tools/ci/check-conventional-commits.ts \
            --from "origin/${{ github.base_ref }}" \
            --to "${{ github.sha }}"

  # ----------------------------------------------------------
  # 6. E2E (Playwright) sobre un stack Supabase LOCAL y efímero
  # ----------------------------------------------------------
  # HISTÓRICO: este job autenticaba contra el proyecto Supabase hospedado con un
  # credential `Administrador` guardado como secret de GitHub (primero a nivel
  # repo, luego en el environment `e2e`). Hoy levanta su propio stack con
  # `supabase start` y las claves públicas y estáticas del entorno local
  # (`supabase/config.toml`): en CI no queda ningún credential real que robar
  # (issue #138, opción C).
  #
  # Tampoco hay preflight ni `environment:`: "se saltea si faltan los secrets"
  # reportaba verde sin cubrir nada (pasó de verdad: 9 de 12 tests). El stack se
  # levanta siempre, y si no levanta o si la suite se saltea un test, el job FALLA.
  e2e:
    name: E2E smoke (Playwright, local Supabase)
    runs-on: ubuntu-24.04 # Playwright 1.57 has no chromium deps on ubuntu-26.04 (what ubuntu-latest became)
    env:
      E2E_USER: e2e-automation
      # Same names the provisioning script defaults to; spelled out so the job
      # reads as what it covers (Administrador + the two view-only roles).
      E2E_OPERADOR_USER: e2e-operador
      E2E_DESPACHADOR_USER: e2e-despachador
      # Optional repo variable; the default is what every spec and the fixture
      # were written against. It is a product name, not a credential.
      E2E_PRODUCT: ${{ vars.E2E_PRODUCT || 'Arroz' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: Ensure psql client
        # The fixture and the role password are applied with psql; the runner
        # image happens to ship one, but the step must not depend on that.
        working-directory: .
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi

      # Cold runners pull the stack images (~1-3 min). The stack IS the job, so
      # an unstartable stack must fail here instead of skipping the suite.
      - name: Start the local Supabase stack
        working-directory: .
        run: npx --yes supabase@3.0.0 start

      # One recipe for CI and for a developer (app/SETUP-LOCAL.md): Prisma
      # migrations as supabase_admin, a per-run password for the RLS-bound app
      # role, the CI fixture, the business seeds, the GoTrue user (with the
      # password grant proven) and the env file the app and the specs read.
      - name: Provision the E2E tenant, identity and env file
        working-directory: .
        env:
          ENV_FILE: app/.env
        run: bash .github/ci/provision-local-e2e.sh

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the confirm smoke
        # El reporte JSON es el insumo del guard de skips de abajo; `list` queda
        # para que el log se lea igual que antes.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: pnpm exec playwright test --reporter=list,json

      - name: Fail when a test is skipped
        # Un job verde con skips lee como cobertura aunque no la haya: Playwright
        # no tiene fail-on-skip nativo, así que el guard lee el reporte JSON y
        # falla si el run está vacío o si algún test se salteó.
        run: node e2e/assert-no-skips.mjs e2e-results.json

      - name: Stack status on failure
        if: failure()
        working-directory: .
        run: npx --yes supabase@3.0.0 status

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  # ----------------------------------------------------------
  # Gate: único check requerido por la protección de `master`
  # ----------------------------------------------------------
  # ----------------------------------------------------------
  # 7. Supply chain: advisories contra el lockfile de PRODUCCIÓN
  # ----------------------------------------------------------
  # Va dentro de ci-gate: un job que el gate no espera no bloquea un merge, y
  # esto tiene que bloquearlo. `--prod` a propósito: las devDependencies no se
  # despliegan, así que exigirles cero advisories convertiría el gate en ruido
  # que alguien apaga. `--audit-level high` deja pasar low/moderate (0.18.5
  # quedó sin NINGUNA advisory en prod, alto incluido, tras subir next a 16.4.5
  # y forzar fast-uri/source-map-js).
  audit:
    name: Dependency audit (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-project

      - name: pnpm audit (prod, high and above)
        run: pnpm audit --prod --audit-level high

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, unit, integration, build, commits, e2e, audit]
    runs-on: ubuntu-latest
    # Agregador puro: no hace checkout, así que no hereda el cwd app/.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail when a required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::Uno o más jobs de CI fallaron. Revisá el resumen del workflow."
          exit 1

      - name: All required jobs passed
        run: |
          echo "OK: lint, types, schema, unit, integration, build, e2e y audit de dependencias en verde."
