# ============================================================
# NOT a workspace — this file holds pnpm 11+ configuration only.
# We are NOT a monorepo (no `packages:` field). The file exists to
# register `allowBuilds` (lifecycle scripts that may run during install)
# and `overrides` (forced versions of vulnerable transitive deps).
# pnpm 11+ reads these settings HERE, not from package.json#pnpm.
# Ver: https://pnpm.io/settings
#
# If you need to add a package that runs build scripts (e.g. a new native
# dependency), add it here — not in package.json#pnpm.allowBuilds.
# ============================================================

# pnpm 11 usa allowBuilds (mapa name -> true), no onlyBuiltDependencies (era pnpm 9/10).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  workerd: false

# Security advisory overrides — backend-quality-polish stage 4 (PR 4).
# These three transitive deps arrive ONLY via the prisma@7.10.0 bundle
# (prisma > @prisma/studio-core > @visx/* > lodash;
#  prisma > @prisma/config > deepmerge-ts;
#  prisma > mysql2) and their vulnerable versions are pinned by prisma's own
# dependency ranges, so the only way to lift them above the GHSA patched
# floors without waiting for a prisma release is to force them here.
# Floors: lodash >=4.18.1 (GHSA-r5fr-rjxr-66jc / -f23m-r3pf-42rh / -xxjr-mmjv-4gpg),
#         deepmerge-ts >=8.0.0 (GHSA-ggr8-5vv4-36mx),
#         mysql2 >=3.22.0 (GHSA-3f6p-5ww8-9rcr; resolves to 3.24.4, which also
#         clears the decompression-bomb GHSA-rgwj-5xj2-c3m3 fixed in 3.23.1).
overrides:
  lodash: '>=4.18.1'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.22.0'
  # 0.18.5 — prod-scope advisories reached through prisma's CLI chain
  # (ajv > fast-uri) and through postcss (source-map-js). Patch-level floors.
  fast-uri: '>=3.1.9'
  source-map-js: '>=1.2.2'
  # 0.39.0 — prod-scope advisory reached through the prisma CLI chain
  # (prisma > @prisma/config > effect): ReDoS in Schema.TemplateLiteral
  # compiled regex (GHSA-7589-6fvf-x4pw, audit id 1248071), patched >=3.22.1.
  # effect@3.20.0 is pinned by @prisma/config's own range; patch-level floor
  # WITH major selector — a bare floor dragged effect@4 and broke
  # @prisma/config's loader (postinstall "reading 'right'").
  'effect@3': '>=3.22.1 <4'

  # 0.34.3 - DEV-scope advisories (eslint/jest/ts-jest/shadcn chains; none reaches the prod
  # build, `pnpm audit --prod` was already clean). Selector per MAJOR with an upper bound:
  # a bare override would drag one major onto every consumer (eslint, jest, express 5).
  # Floors are the advisory patched versions; pnpm takes the newest inside the major.
  # brace-expansion: GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  'brace-expansion@1': '>=1.1.21 <2'
  'brace-expansion@2': '>=2.1.7 <3'
  'brace-expansion@5': '>=5.0.12 <6'
  # handlebars (ts-jest): GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f, GHSA-xw65-4hp5-5hc7
  'handlebars@4': '>=4.7.10 <5'
  # undici (shadcn / dotenvx chain): GHSA-2m5v-pch6-74hx, GHSA-4w7w-5xrc-9h26, GHSA-qrxm-fqhp-jwvm,
  # GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-55wc-3pg8-jfw6, GHSA-9fm3-97px-rjf6, GHSA-f72v-6w45-q472
  'undici@7': '>=7.30.1 <8'
  # systeminformation (dotenvx): GHSA-3f7j-7jwc-fxfj
  'systeminformation@5': '>=5.33.16 <6'
  # body-parser (MCP SDK > express 5): GHSA-27r3-jxmh-p828
  'body-parser@2': '>=2.4.0 <3'
  # hono: GHSA-3gg2-335m-rxc6, GHSA-46wx-v44x-9hh2, GHSA-4h7h-rv7c-7m2v, GHSA-4m76-xfj5-7975, GHSA-h7mg-cq63-vhpq
  'hono@4': '>=4.13.16 <5'
  # @hono/node-server: GHSA-jpvv-r467-5p4w, GHSA-qv5m-9pm6-hqp3
  '@hono/node-server@2': '>=2.1.6 <3'
  # qs: GHSA-6pq8-jhm2-2vcw
  'qs@6': '>=6.16.1 <7'
  # js-yaml 4.x only (eslint): GHSA-2883-xcg3-v3hh. The 3.x copy (istanbul) is not affected.
  'js-yaml@4': '>=4.3.2 <5'
  # 0.35.0 follow-up (dev-scope audit recheck 2026-11-16): the upstream fixes
  # now exist, so these leave the parked list. Cross-major overrides, each
  # verified by the full suite (incl. an eslint run and a jest coverage run
  # for the test-exclude>glob chain).
  # glob: GHSA-3g3m-2fjr-6pw4 (AbortSignal cancellation bypass) - patched in 14.0.2.
  'glob@10': '>=14.0.2 <15'
  # minimatch: GHSA-3h5v-q93c-6h6q (globparts amplification DoS) - patched in 11.0.1.
  'minimatch@10': '>=11.0.1 <12'
  # PARKED list emptied on 2026-11-16 (dev-deps cleanup): zod 3.25.x left with the
  # shadcn 4.23.0 upgrade (shadcn moved to Zod 4 itself); deepmerge no longer appears
  # in the audit; glob 10.x and minimatch 10.x lifted by the cross-major overrides
  # above (patched versions 14.0.2 / 11.0.1, verified by the full suite incl. eslint
  # and a jest coverage run). Audit now reports zero known vulnerabilities.
  # Standing order: nothing updates itself — re-run pnpm audit --audit-level moderate
  # on upstream releases and report to the owner before ever changing versions.
